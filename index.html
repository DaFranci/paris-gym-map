<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Paris Gym Map</title>
<meta name="description" content="Every gym in Paris and Île-de-France on one map. Compare the chains side by side and find the gym closest to your home or your work.">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root {
    --bg: #f6f7fb; --panel: #ffffff; --fg: #14151a; --muted: #6b7080; --line: #e6e8ef; --hover: #f1f3f9;
    --accent: #4f46e5; --accent-soft: #eef0ff; --shadow: 0 1px 2px rgba(16,24,40,.06), 0 4px 16px rgba(16,24,40,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f1014; --panel: #17181d; --fg: #f2f3f7; --muted: #9a9fb0; --line: #272a33; --hover: #20222a;
            --accent: #8b85ff; --accent-soft: #23233d; --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 16px rgba(0,0,0,.3); }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; font: 14px/1.45 Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
               background: var(--bg); color: var(--fg); -webkit-font-smoothing: antialiased; }
  #app { display: flex; height: 100%; }
  #side { width: 360px; flex-shrink: 0; min-height: 0; display: flex; flex-direction: column; background: var(--panel);
          border-right: 1px solid var(--line); box-shadow: var(--shadow); z-index: 500; }
  #map { flex: 1; background: var(--bg); }

  header { padding: 18px 18px 12px; }
  .title-row { display: flex; align-items: center; gap: 10px; }
  .logo { width: 34px; height: 34px; border-radius: 10px; background: var(--accent); color: #fff; flex-shrink: 0;
          display: grid; place-items: center; }
  .logo svg { width: 20px; height: 20px; }
  h1 { font-size: 17px; font-weight: 700; letter-spacing: -.01em; margin: 0; flex: 1; min-width: 0; white-space: nowrap;
       overflow: hidden; text-overflow: ellipsis; }
  #tagline { margin: 12px 0 14px; font-size: 13px; color: var(--muted); }

  .lang { display: flex; gap: 6px; }
  .lang button { padding: 0; border: 0; background: none; cursor: pointer; border-radius: 4px; line-height: 0;
                 opacity: .45; transition: opacity .15s, box-shadow .15s; }
  .lang button:hover { opacity: .8; }
  .lang button[aria-pressed="true"] { opacity: 1; box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--accent); }
  .lang svg { width: 24px; height: 16px; border-radius: 3px; box-shadow: 0 0 0 1px rgba(0,0,0,.12); }

  .stats { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .stat { background: var(--accent-soft); border-radius: 10px; padding: 8px 12px; }
  .stat b { display: block; font-size: 20px; font-weight: 700; letter-spacing: -.02em; color: var(--accent); }
  .stat span { font-size: 12px; color: var(--muted); }
  #updated { margin-top: 8px; font-size: 11px; color: var(--muted); }

  .controls { display: flex; gap: 6px; padding: 6px 18px; flex-wrap: wrap; }
  .search { position: relative; width: 100%; }
  .search svg { position: absolute; left: 11px; top: 50%; width: 15px; height: 15px; transform: translateY(-50%); color: var(--muted); }
  input[type=search] { width: 100%; padding: 9px 12px 9px 34px; border: 1px solid var(--line); border-radius: 10px;
                       background: var(--bg); color: var(--fg); font: inherit; outline: none; }
  input[type=search]:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .controls button { padding: 6px 11px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel);
                     color: var(--fg); font: inherit; font-size: 12px; font-weight: 500; cursor: pointer; }
  .controls button:hover { background: var(--hover); }

  #list { flex: 1; min-height: 0; overflow-y: auto; padding: 6px 10px 16px; }
  label.chain { position: relative; display: flex; align-items: center; gap: 10px; padding: 7px 8px; border-radius: 8px; cursor: pointer; }
  label.chain:hover { background: var(--hover); }
  label.chain input { position: absolute; opacity: 0; pointer-events: none; }
  .swatch { width: 16px; height: 16px; border-radius: 5px; flex-shrink: 0; border: 2px solid var(--c); background: transparent;
            display: grid; place-items: center; transition: background .15s; }
  .swatch svg { width: 10px; height: 10px; color: #fff; opacity: 0; }
  label.chain input:checked + .swatch { background: var(--c); }
  label.chain input:checked + .swatch svg { opacity: 1; }
  label.chain input:focus-visible + .swatch { box-shadow: 0 0 0 3px var(--accent-soft); }
  .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  label.chain input:not(:checked) ~ .name { color: var(--muted); }
  .count { font-variant-numeric: tabular-nums; font-size: 11px; font-weight: 600; color: var(--muted);
           background: var(--hover); border-radius: 999px; padding: 1px 8px; }
  .sep { color: var(--muted); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; padding: 14px 8px 6px; }

  footer { padding: 10px 18px; font-size: 11px; color: var(--muted); border-top: 1px solid var(--line); }
  footer a { color: var(--muted); }

  .leaflet-container { font: inherit; }
  .leaflet-bar { border: 0 !important; box-shadow: var(--shadow) !important; border-radius: 10px !important; overflow: hidden; }
  .leaflet-bar a { background: var(--panel); color: var(--fg); border-color: var(--line); }
  .leaflet-popup-content-wrapper { border-radius: 12px; box-shadow: 0 8px 28px rgba(16,24,40,.18); }
  .leaflet-popup-content { margin: 12px 14px; font-size: 13px; line-height: 1.45; }
  .pop-chain { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 600; color: #555;
               background: #f2f3f7; border-radius: 999px; padding: 2px 8px 2px 6px; margin-bottom: 6px; }
  .pop-chain i { width: 8px; height: 8px; border-radius: 50%; }
  .pop-name { font-weight: 700; font-size: 14px; margin-bottom: 2px; }
  .pop-src { color: #777; font-size: 12px; margin-top: 6px; }
  .leaflet-popup-content a { color: #4f46e5; font-weight: 500; }

  @media (max-width: 700px) {
    #app { flex-direction: column-reverse; }
    #side { width: 100%; height: 52%; border-right: 0; border-top: 1px solid var(--line); border-radius: 16px 16px 0 0; overflow-y: auto; }
    #list { flex: none; overflow: visible; }  /* on phones the whole panel scrolls as one */
    header { padding: 14px 16px 8px; }
    #tagline { font-size: 12px; margin: 8px 0 10px; }
    .stat { padding: 6px 10px; }
    .stat b { font-size: 17px; }
    .controls { padding: 6px 16px; }
  }
</style>
</head>

const ESRI = 'https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/';
L.tileLayer(ESRI + 'World_Light_Gray_Base/MapServer/tile/{z}/{y}/{x}', {
  attribution: 'Tiles © Esri — Esri, HERE, Garmin, © OpenStreetMap contributors', maxZoom: 16
}).addTo(map);
L.tileLayer(ESRI + 'World_Light_Gray_Reference/MapServer/tile/{z}/{y}/{x}', { maxZoom: 16 }).addTo(map);

const $ = id => document.getElementById(id);

// "Les Cercles de la Forme" / "cercles de la forme" / "Body Hit" / "Bodyhit" -> same key
function normKey(s) {
  return s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase()
    .replace(/^(?:(?:les?|la)\s+|l['’]\s*)/, '').replace(/[^a-z0-9]/g, '');  // "La Salle" -> "salle", but "Lady Fit" stays
}

const keyOf = g => normKey(g.tags.brand || g.tags.name || '');
// Unnamed OSM entries can't be identified, so they're left off too.
const isUnwanted = g => REMOVED.has(g.id) || (!g.source && !keyOf(g));
const isOutdated = g => CLOSED.has(g.id) || DEFUNCT.some(re => re.test(keyOf(g)));
const isNotGym = g => NOT_GYMS.some(re => re.test(keyOf(g)));  // brand for chain clubs, so "Fitness Park Stade de France" stays

function editDistance(a, b) {
  let prev = Array.from({ length: b.length + 1 }, (_, j) => j);
  for (let i = 1; i <= a.length; i++) {
    const cur = [i];
    for (let j = 1; j <= b.length; j++)
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + (a[i - 1] === b[j - 1] ? 0 : 1));
    prev = cur;
  }
  return prev[b.length];
}

function groupChains(gyms) {
  const groups = new Map();
  for (const g of gyms) {
    let raw = g.tags.brand || g.tags.name || '';
    const rule = raw && CANONICAL.find(([re]) => re.test(normKey(raw)));
    if (rule) raw = rule[1];
    else if (raw && NOT_CHAINS.some(re => re.test(normKey(raw)))) raw = '';
    const key = raw ? normKey(raw) : '';
    if (!groups.has(key)) groups.set(key, { key, names: {}, gyms: [] });
    const grp = groups.get(key);
    grp.gyms.push(g);
    if (raw) grp.names[raw] = (grp.names[raw] || 0) + 1;
  }
  const all = [...groups.values()].filter(x => x.key).sort((a, b) => b.gyms.length - a.gyms.length);
  const big = [];
  const other = { key: '__other', gyms: [] };  // independents and chains with one club in the region
  // Fold variants into the larger chain: "Dynamo Spinning" -> "Dynamo", and one-letter
  // typos like "Fitness Parc" -> "Fitness Park" (also "Fitness Parc Issy").
  const belongsTo = (key, b) => b.key.length >= 5 && (key.startsWith(b.key) ||
    (b.key.length >= 8 && [-1, 0, 1].some(d => editDistance(key.slice(0, b.key.length + d), b.key) <= 1)));
  for (const grp of all) {
    const parent = big.find(b => belongsTo(grp.key, b));
    if (parent) {
      parent.gyms.push(...grp.gyms);
      for (const n in grp.names) parent.names[n] = (parent.names[n] || 0) + grp.names[n];
    } else if (grp.gyms.length >= MIN_LOCATIONS) big.push(grp);
    else other.gyms.push(...grp.gyms);
  }
  other.gyms.push(...(groups.get('')?.gyms || []));
  // A chain with its own club list (clubs.js) shows only those clubs; its OSM entries are dropped.
  for (const b of big) if (b.gyms.some(g => g.source)) b.gyms = b.gyms.filter(g => g.source);
  big.sort((a, b) => b.gyms.length - a.gyms.length);
  big.forEach((b, i) => {
    b.label = Object.entries(b.names).sort((x, y) => y[1] - x[1])[0][0];
    b.color = PALETTE[i % PALETTE.length];
    b.on = i < DEFAULT_ON;
  });
  other.color = OTHER_COLOR; other.on = false;
  return [...big, other];
}

// Interface text in English and French
const TEXT = {
  en: {
    title: 'Paris Gym Map',
    tagline: 'Every gym in Paris and Île-de-France, on one map. Compare the chains side by side and find the one closest to your home or your work.',
    search: 'Filter chains…', all: 'All', none: 'None', fit: 'Zoom to selected',
    other: 'Other gyms', otherHeading: 'Single location in Île-de-France',
    gymsLabel: 'gyms', chainsLabel: 'chains', updated: date => `Updated ${date}`,
    srcSite: 'Source: official website', srcOsm: 'Source: OpenStreetMap', website: 'Website', osm: 'View on OSM',
    footer: 'Gym data © <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> contributors and the gyms’ official websites. Map tiles © Esri.',
    noData: 'No gym data found.',
  },
  fr: {
    title: 'Carte des salles de sport',
    tagline: 'Toutes les salles de sport de Paris et d’Île-de-France, sur une seule carte. Comparez les enseignes et trouvez la plus proche de chez vous ou de votre travail.',
    search: 'Filtrer les enseignes…', all: 'Toutes', none: 'Aucune', fit: 'Zoomer sur la sélection',
    other: 'Autres salles', otherHeading: 'Un seul site en Île-de-France',
    gymsLabel: 'salles de sport', chainsLabel: 'enseignes', updated: date => `Mis à jour le ${date}`,
    srcSite: 'Source : site officiel', srcOsm: 'Source : OpenStreetMap', website: 'Site web', osm: 'Voir sur OSM',
    footer: 'Données © contributeurs <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a> et sites officiels des salles. Fond de carte © Esri.',
    noData: 'Aucune donnée trouvée.',
  },
};
let lang = 'en';
try { lang = localStorage.getItem('lang') || ''; } catch (e) {}
if (!TEXT[lang]) lang = (navigator.language || '').toLowerCase().startsWith('fr') ? 'fr' : 'en';
const t = key => TEXT[lang][key];
const chainLabel = c => c.key === '__other' ? t('other') : c.label;
let updated = 0;

function popupHtml(g, chain) {
  const tg = g.tags, esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const addr = tg.address || [[tg['addr:housenumber'], tg['addr:street']].filter(Boolean).join(' '), tg['addr:postcode']].filter(Boolean).join(', ');
  const site = tg.website || tg['contact:website'];
  const link = (href, text) => `<a href="${esc(href)}" target="_blank" rel="noopener">${text}</a>`;
  const other = chain.key === '__other';
  return (other ? '' : `<div class="pop-chain"><i style="background:${chain.color}"></i>${esc(chain.label)}</div>`) +
    `<div class="pop-name">${esc(tg.name || chain.label)}</div>` +
    (addr ? `<div>${esc(addr)}</div>` : '') +
    (tg.opening_hours ? `<div class="pop-src">${esc(tg.opening_hours)}</div>` : '') +
    (g.source
      ? `<div class="pop-src">${t('srcSite')}</div>` + (site ? link(site, t('website')) : '')
      : `<div class="pop-src">${t('srcOsm')}</div>` + (site ? link(site, t('website')) + ' · ' : '') +
        link('https://www.openstreetmap.org/' + g.id, t('osm')));
}

function build(gyms) {
  chains.forEach(c => c.layer && map.removeLayer(c.layer));
  chains = groupChains(gyms);
  for (const c of chains) {
    c.layer = L.layerGroup(c.gyms.map(g =>
      L.circleMarker([g.lat, g.lon], {
        radius: c.key === '__other' ? 4.5 : 7.5, color: '#fff', weight: 2,
        fillColor: c.color, fillOpacity: c.key === '__other' ? 0.7 : 0.95
      }).bindPopup(() => popupHtml(g, c))
    ));
    if (c.on) c.layer.addTo(map);
  }
  renderText();
}

function renderStatus() {
  if (!chains.length) return;
  const fmt = new Intl.NumberFormat(lang === 'fr' ? 'fr-FR' : 'en-GB');
  $('stat-gyms').textContent = fmt.format(chains.reduce((n, c) => n + c.gyms.length, 0));
  $('stat-chains').textContent = fmt.format(chains.length - 1);
  const date = new Date(updated).toLocaleDateString(lang === 'fr' ? 'fr-FR' : 'en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
  $('updated').textContent = TEXT[lang].updated(date);
}

// All language-dependent text on the page
function renderText() {
  document.documentElement.lang = lang;
  document.title = t('title');
  document.querySelectorAll('[data-i18n]').forEach(el => { el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll('.lang button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));
  $('search').placeholder = t('search');
  $('footer').innerHTML = t('footer');
  map.closePopup();
  renderStatus();
  renderList();
}

function setOn(c, on) {
  c.on = on;
  if (on) c.layer.addTo(map); else map.removeLayer(c.layer);
}

function renderList() {
  const f = normKey($('search').value || '');
  const list = $('list');
  list.innerHTML = '';
  chains.forEach(c => {
    if (f && !normKey(chainLabel(c)).includes(f)) return;
    if (c.key === '__other') {
      const h = document.createElement('div');
      h.className = 'sep';
      h.textContent = t('otherHeading');
      list.appendChild(h);
    }
    const el = document.createElement('label');
    el.className = 'chain';
    el.style.setProperty('--c', c.color);
    el.innerHTML = `<input type="checkbox" ${c.on ? 'checked' : ''}>` +
      `<span class="swatch"><svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 6.2 5 8.5l4.5-5"/></svg></span>` +
      `<span class="name"></span><span class="count">${c.gyms.length}</span>`;
    el.querySelector('.name').textContent = chainLabel(c);
    el.querySelector('input').onchange = e => setOn(c, e.target.checked);
    list.appendChild(el);
  });
}

function visibleChains() {
  const f = normKey($('search').value || '');
  return chains.filter(c => !f || normKey(chainLabel(c)).includes(f));
}

$('search').oninput = renderList;
$('all').onclick = () => { visibleChains().forEach(c => c.key !== '__other' && setOn(c, true)); renderList(); };
$('none').onclick = () => { visibleChains().forEach(c => setOn(c, false)); renderList(); };
$('fit').onclick = () => {
  const pts = chains.filter(c => c.on).flatMap(c => c.gyms.map(g => [g.lat, g.lon]));
  if (pts.length) map.fitBounds(pts, { padding: [30, 30], maxZoom: 15 });
};
document.querySelectorAll('.lang button').forEach(b => b.onclick = () => {
  lang = b.dataset.lang;
  try { localStorage.setItem('lang', lang); } catch (e) {}
  renderText();
});

// Chains' club lists (clubs.js); they replace those chains' OpenStreetMap entries
function chainClubs() {
  return (window.CLUBS?.clubs || []).map((c, i) => ({
    lat: c.lat, lon: c.lon, id: c.website || 'club/' + i, source: 'site',
    tags: { brand: c.chain, name: c.name, address: c.address, website: c.website }
  }));
}

if (window.GYM_DATA) {
  updated = Math.max(window.GYM_DATA.t || 0, window.CLUBS?.updated || 0);
  build([...window.GYM_DATA.gyms.filter(g => !isOutdated(g)), ...chainClubs()]
    .filter(g => !isNotGym(g) && !isUnwanted(g)));
} else {
  renderText();
  $('status').textContent = t('noData');
}
